name: Trading Economics Daily Scraper

on:
  schedule:
    # UTC 기준 21:30 (한국 시간 기준 매일 아침 06:30 실행)
    - cron: '30 21 * * *' 
  workflow_dispatch: # 깃허브 웹사이트에서 수동으로 실행할 수 있는 버튼 활성화

jobs:
  update-sheet:
    runs-on: ubuntu-latest
    
    steps:
    - name: 저장소 체크아웃
      uses: actions/checkout@v3

    - name: 파이썬 3.10 환경 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 필요한 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 gspread oauth2client

    - name: 크롤러 실행 및 구글 시트 업데이트
      env:
        # 깃허브 Secrets에 저장된 GCP 키를 환경변수로 주입
        GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
      run: python scraper.py
